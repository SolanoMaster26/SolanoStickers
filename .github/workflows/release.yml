name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and build extension
        run: |
          npm run typecheck
          npm test
          npm run build --workspace=@solanostickers/extension
      - name: Package Chrome extension zip
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          (cd apps/extension/dist && zip -r "../../../release-assets/SolanoStickers-${VERSION}-chrome-extension.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension-assets
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@solanostickers/desktop
      - name: Build Tauri Windows installers and executable
        shell: pwsh
        run: |
          npx --workspace=@solanostickers/desktop tauri build --bundles nsis,msi
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "${{ github.event.inputs.tag }}" }
          $ver = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "target/release/solanostickers-desktop.exe" "release-assets/SolanoStickers-${ver}-windows-x64.exe"
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/SolanoStickers-${ver}-windows-x64-setup.exe"
          }
          Get-ChildItem "target/release/bundle/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/SolanoStickers-${ver}-windows-x64.msi"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@solanostickers/desktop
      - name: Build Tauri macOS Universal (.app & .dmg)
        shell: bash
        run: |
          npx --workspace=@solanostickers/desktop tauri build --target universal-apple-darwin --bundles app,dmg
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "release-assets/SolanoStickers-${VERSION}-macos-universal.dmg"
          (cd target/universal-apple-darwin/release/bundle/macos && zip -r "../../../../../release-assets/SolanoStickers-${VERSION}-macos-universal.app.zip" SolanoStickers.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*

  publish-release:
    needs: [build-extension, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }}
          name: SolanoStickers ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }} — Windows, macOS & Chrome Extension
          generate_release_notes: true
          body: |
            ## 🌐 Versión Web (sin instalación) y Descargas (100% local, sin FFmpeg)

            > **¿Prefieres no instalar nada?** Usa la versión web en **[solanomaster26.github.io/SolanoStickers](https://solanomaster26.github.io/SolanoStickers/)** (funciona en PC, Android y iPhone como PWA con audios descargados en tu dispositivo). Para pegar enlaces directos de **MyInstants** o exportar **WebM transparente**, descarga la app de escritorio o la extensión de Chrome abajo.

            | Plataforma | Archivo recomendado | Cómo usar |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `SolanoStickers-*-windows-x64.exe` *(portable)* o `*-setup.exe` *(instalador)* | Doble clic para abrir o instalar al instante. |
            | **macOS (Apple Silicon & Intel)** | `SolanoStickers-*-macos-universal.dmg` o `.app.zip` | Arrastra `SolanoStickers.app` a **Aplicaciones**. *(Si macOS muestra aviso de desarrollador no verificado: clic derecho → **Abrir**).* |
            | **Google Chrome / Edge / Brave** | `SolanoStickers-*-chrome-extension.zip` | Descomprime el ZIP, abre `chrome://extensions/`, activa **Modo de desarrollador** y pulsa **Cargar descomprimida** seleccionando la carpeta descomprimida. |

            ### Qué incluye esta versión
            - Soporte para stickers **PNG con transparencia**, **WebP**, **JPG** y **GIF animado** (en bucle con duración mínima de un ciclo y sincronizado con la vista previa).
            - Encuadre `1:1` automático desde el centro o moviendo el mouse encima **sin hacer clic**.
            - Selector directo de transparencia (**Transparente**, **Blanco**, **Negro** o **Color**).
            - Recorte de audio local (`MP3`/`WAV`/`OGG`/`M4A`) o enlace de **MyInstants** con selector **`5s | 10s`**.
            - Interfaz multilingüe en **9 idiomas** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`), diálogo *Acerca de y licencias* renovado y botón **`➔`** / **`⬇`** para previsualizar, copiar o descargar (`MP4`, `WebM`, `ZIP` o `WebP`).

            ---

            <details>
            <summary><strong>🇺🇸 English — Release Guide & Downloads (Click to expand)</strong></summary>

            > **Prefer zero installation?** Use the Web App at **[solanomaster26.github.io/SolanoStickers](https://solanomaster26.github.io/SolanoStickers/)** (works on PC, Android & iPhone PWA with downloaded audio files). To paste direct **MyInstants** links or export **transparent WebM**, download the Desktop app or Chrome extension below.

            | Platform | Recommended file | How to use |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `SolanoStickers-*-windows-x64.exe` *(portable)* or `*-setup.exe` *(installer)* | Double-click to run or install immediately. |
            | **macOS (Apple Silicon & Intel)** | `SolanoStickers-*-macos-universal.dmg` or `.app.zip` | Drag `SolanoStickers.app` to **Applications**. *(If Gatekeeper warns about an unverified developer: right-click → **Open**).* |
            | **Google Chrome / Edge / Brave** | `SolanoStickers-*-chrome-extension.zip` | Unzip the archive, open `chrome://extensions/`, enable **Developer mode**, and click **Load unpacked** on the extracted folder. |

            #### Highlights
            - Supports **PNG with alpha**, **WebP**, **JPG**, and **animated GIF** (looped, matching preview delays and per-frame keyframes).
            - Zero-click `1:1` crop framing, direct matte/transparency selector, and `5s | 10s` audio duration toggle.
            - **9 built-in UI languages** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`) and updated About & licenses dialog.

            </details>

            <details>
            <summary><strong>🇧🇷 Português — Guia de Lançamento e Downloads (Clique para expandir)</strong></summary>

            > **Prefere não instalar nada?** Use a versão web em **[solanomaster26.github.io/SolanoStickers](https://solanomaster26.github.io/SolanoStickers/)** (funciona no PC, Android e iPhone como PWA com áudios baixados). Para colar links diretos do **MyInstants** ou exportar **WebM transparente**, baixe o app de desktop ou a extensão do Chrome abaixo.

            | Plataforma | Arquivo recomendado | Como usar |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `SolanoStickers-*-windows-x64.exe` *(portátil)* ou `*-setup.exe` *(instalador)* | Clique duas vezes para abrir ou instalar. |
            | **macOS (Apple Silicon & Intel)** | `SolanoStickers-*-macos-universal.dmg` ou `.app.zip` | Arraste `SolanoStickers.app` para **Aplicativos**. *(Se aparecer aviso de desenvolvedor não verificado: clique com o botão direito → **Abrir**).* |
            | **Google Chrome / Edge / Brave** | `SolanoStickers-*-chrome-extension.zip` | Extraia o ZIP, abra `chrome://extensions/`, ative o **Modo do desenvolvedor** e clique em **Carregar sem compactação**. |

            #### Novidades incluídas
            - Suporte para **PNG com transparência**, **WebP**, **JPG** e **GIF animado** (em loop sincronizado com a prévia).
            - Enquadramento `1:1` sem clique, seletor direto de fundo/transparência e botão de duração **`5s | 10s`**.
            - **9 idiomas na interface** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`) e janela Sobre e licenças atualizada.

            </details>
          files: artifacts/*

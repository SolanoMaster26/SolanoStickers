[workspace]
resolver = "2"
members = [
  "crates/image-engine",
  "crates/audio-engine",
  "crates/video-engine",
  "crates/project-store",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["César Solano"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
